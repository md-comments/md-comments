name: Deploy Static Website & Astro Demo to Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'website/**'
      - 'demo-astro/**'
      - 'starlight-plugin/**'
      - 'shared/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Core Libraries
        run: |
          pnpm --filter @md-comments/shared run build
          pnpm --filter @md-comments/starlight run build

      - name: Build Astro Demo Site
        run: pnpm --filter md-comments-demo-astro run build

      - name: Assemble Combined Site
        run: |
          mkdir -p _site/demo-astro
          cp -r website/* _site/
          cp -r demo-astro/dist/* _site/demo-astro/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
