name: Development Release (Draft)

on:
  push:
    branches:
      - main

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      environment: 'Development'
    secrets: inherit

  draft-release:
    name: Publish Draft Release
    needs: build
    runs-on: ubuntu-latest
    environment: Development
    permissions:
      contents: write
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: artifacts

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          tag_name: v${{ needs.build.outputs.version }}-dev
          name: Release v${{ needs.build.outputs.version }} (Dev Draft)
          files: |
            artifacts/**/*.vsix
            artifacts/obsidian-plugin.zip
            artifacts/chrome-extension.zip
