name: Deploy to Marketplaces

on:
  release:
    types: [published, edited]

jobs:
  deploy-vscode:
    name: Deploy VS Code Extension
    if: github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Download Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          if [ "$ACT" = "true" ]; then
            echo "Running under local runner (act). Skipping asset download and using local artifacts."
          else
            gh release download ${{ github.event.release.tag_name }} --pattern "*" --dir artifacts
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Deploy VS Code Extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          # Find the .vsix file in downloaded artifacts
          VSIX_FILE=$(find artifacts -name "*.vsix" | head -n 1)
          if [ -z "$VSIX_FILE" ]; then
            echo "Error: No .vsix file found in release assets!"
            exit 1
          fi
          echo "Publishing VS Code Extension: $VSIX_FILE"
          pnpm dlx @vscode/vsce publish --packagePath "$VSIX_FILE" -p "$VSCE_PAT" --skip-duplicate

  deploy-openvsx:
    name: Deploy to Open VSX Registry
    if: github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Download Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          if [ "$ACT" = "true" ]; then
            echo "Running under local runner (act). Skipping asset download and using local artifacts."
          else
            gh release download ${{ github.event.release.tag_name }} --pattern "*" --dir artifacts
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Deploy to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          # Find the .vsix file in downloaded artifacts
          VSIX_FILE=$(find artifacts -name "*.vsix" | head -n 1)
          if [ -z "$VSIX_FILE" ]; then
            echo "Error: No .vsix file found in release assets!"
            exit 1
          fi
          echo "Publishing to Open VSX: $VSIX_FILE"
          # Capture output to check for duplicate/already published errors
          STATUS=0
          OUTPUT=$(pnpm dlx ovsx publish "$VSIX_FILE" -p "$OVSX_PAT" 2>&1) || STATUS=$?
          echo "$OUTPUT"
          if [ $STATUS -ne 0 ]; then
            if echo "$OUTPUT" | grep -qi -E "already published|already exists|conflict|409"; then
              echo "Extension version already published to Open VSX. Skipping."
            else
              exit $STATUS
            fi
          fi

  deploy-chrome:
    name: Deploy Chrome Extension
    if: github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Download Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          if [ "$ACT" = "true" ]; then
            echo "Running under local runner (act). Skipping asset download and using local artifacts."
          else
            gh release download ${{ github.event.release.tag_name }} --pattern "*" --dir artifacts
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Deploy Chrome Extension
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          npm install --no-save chrome-webstore-upload@3.2.0
          node -e '
          const fs = require("fs");
          const chromeWebstoreUpload = require("chrome-webstore-upload").default;
          
          const store = chromeWebstoreUpload({
            extensionId: process.env.EXTENSION_ID,
            clientId: process.env.CLIENT_ID,
            clientSecret: process.env.CLIENT_SECRET,
            refreshToken: process.env.REFRESH_TOKEN,
          });
          
          async function run() {
            try {
              console.log("Uploading Chrome Extension...");
              const zipFile = fs.createReadStream("artifacts/chrome-extension.zip");
              const uploadResponse = await store.uploadExisting(zipFile);
              console.log("Upload response:", JSON.stringify(uploadResponse));
              
              if (uploadResponse.uploadState === "FAILURE" && uploadResponse.itemError) {
                const errors = uploadResponse.itemError;
                const isDuplicate = errors.some(e => e.errorCode === "ITEM_VERSION_ALREADY_EXISTS" || e.error_code === "ITEM_VERSION_ALREADY_EXISTS");
                if (isDuplicate) {
                  console.log("Chrome Extension version already published/exists. Skipping.");
                  process.exit(0);
                }
                throw new Error("Upload failed: " + JSON.stringify(errors));
              }
              
              console.log("Publishing Chrome Extension...");
              const publishResponse = await store.publish();
              console.log("Publish response:", JSON.stringify(publishResponse));
            } catch (err) {
              if (err.message && (err.message.includes("ITEM_VERSION_ALREADY_EXISTS") || err.message.includes("already exists") || err.message.includes("already published"))) {
                console.log("Chrome Extension version already published. Skipping.");
                process.exit(0);
              }
              console.error("Deployment failed:", err);
              process.exit(1);
            }
          }
          run();
          '

  deploy-obsidian:
    name: Deploy Obsidian Plugin
    if: github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Obsidian Plugin
        run: |
          echo "Obsidian plugins are published by uploading manifest.json, main.js, and styles.css as assets to the GitHub Release."
          echo "These assets were already uploaded during the pre-release/release phase."
          echo "Obsidian pulls updates directly from the GitHub Release."
