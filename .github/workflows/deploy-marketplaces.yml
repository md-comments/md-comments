name: Deploy to Marketplaces

on:
  release:
    types: [published, edited]

jobs:
  deploy-npm:
    name: Publish Packages to npm (OIDC Trusted Publishing)
    if: github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install & Build Packages
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @md-comments/shared run build
          pnpm --filter @md-comments/starlight run build

      - name: Publish to npm with Provenance
        run: |
          echo "Publishing @md-comments/shared with OIDC provenance..."
          pnpm --filter @md-comments/shared publish --provenance --no-git-checks --access public || echo "Shared package already published or up to date."
          echo "Publishing @md-comments/starlight with OIDC provenance..."
          pnpm --filter @md-comments/starlight publish --provenance --no-git-checks --access public || echo "Starlight plugin already published or up to date."

  deploy-vscode:
    name: Deploy VS Code Extension
    if: github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          if [ "$ACT" = "true" ]; then
            echo "Running under local runner (act). Skipping asset download and using local artifacts."
          else
            gh release download ${{ github.event.release.tag_name }} --pattern "*" --dir artifacts
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Deploy VS Code Extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          # Find the .vsix file in downloaded artifacts
          VSIX_FILE=$(find artifacts -name "*.vsix" | head -n 1)
          if [ -z "$VSIX_FILE" ]; then
            echo "Error: No .vsix file found in release assets!"
            exit 1
          fi
          echo "Publishing VS Code Extension: $VSIX_FILE"
          pnpm dlx @vscode/vsce publish --packagePath "$VSIX_FILE" -p "$VSCE_PAT" --skip-duplicate

  deploy-openvsx:
    name: Deploy to Open VSX Registry
    if: github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          if [ "$ACT" = "true" ]; then
            echo "Running under local runner (act). Skipping asset download and using local artifacts."
          else
            gh release download ${{ github.event.release.tag_name }} --pattern "*" --dir artifacts
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Deploy to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          # Find the .vsix file in downloaded artifacts
          VSIX_FILE=$(find artifacts -name "*.vsix" | head -n 1)
          if [ -z "$VSIX_FILE" ]; then
            echo "Error: No .vsix file found in release assets!"
            exit 1
          fi
          echo "Publishing to Open VSX: $VSIX_FILE"
          STATUS=0
          OUTPUT=$(pnpm dlx ovsx publish "$VSIX_FILE" -p "$OVSX_PAT" 2>&1) || STATUS=$?
          echo "$OUTPUT"
          if [ $STATUS -ne 0 ]; then
            if echo "$OUTPUT" | grep -qi -E "already published|already exists|conflict|409"; then
              echo "Extension version already published to Open VSX. Skipping."
            else
              exit $STATUS
            fi
          fi

  deploy-chrome:
    name: Deploy Chrome Extension
    if: github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          if [ "$ACT" = "true" ]; then
            echo "Running under local runner (act). Skipping asset download and using local artifacts."
          else
            gh release download ${{ github.event.release.tag_name }} --pattern "*" --dir artifacts
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Deploy Chrome Extension
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          npm install --no-save chrome-webstore-upload@3.2.0
          node -e '
          const fs = require("fs");
          const chromeWebstoreUpload = require("chrome-webstore-upload").default;
          
          const store = chromeWebstoreUpload({
            extensionId: process.env.EXTENSION_ID,
            clientId: process.env.CLIENT_ID,
            clientSecret: process.env.CLIENT_SECRET,
            refreshToken: process.env.REFRESH_TOKEN,
          });
          
          async function run() {
            try {
              console.log("Uploading Chrome Extension...");
              const zipFile = fs.createReadStream("artifacts/chrome-extension.zip");
              const uploadResponse = await store.uploadExisting(zipFile);
              console.log("Upload response:", JSON.stringify(uploadResponse));
              
              if (uploadResponse.uploadState === "FAILURE" && uploadResponse.itemError) {
                const errors = uploadResponse.itemError;
                const isDuplicate = errors.some(e => e.errorCode === "ITEM_VERSION_ALREADY_EXISTS" || e.error_code === "ITEM_VERSION_ALREADY_EXISTS");
                if (isDuplicate) {
                  console.log("Chrome Extension version already published/exists. Skipping.");
                  process.exit(0);
                }
                throw new Error("Upload failed: " + JSON.stringify(errors));
              }
              
              console.log("Publishing Chrome Extension...");
              const publishResponse = await store.publish();
              console.log("Publish response:", JSON.stringify(publishResponse));
            } catch (err) {
              if (err.message && (err.message.includes("ITEM_VERSION_ALREADY_EXISTS") || err.message.includes("already exists") || err.message.includes("already published"))) {
                console.log("Chrome Extension version already published. Skipping.");
                process.exit(0);
              }
              if (err.response && err.response.error === "invalid_grant") {
                console.error("\n::error::Google OAuth Refresh Token expired or revoked (invalid_grant).");
                console.error("Fix: Set your OAuth Consent Screen in Google Cloud Console to \"In Production\" (Testing status causes tokens to expire every 7 days).\n");
              }
              console.error("Deployment failed:", err);
              process.exit(1);
            }
          }
          run();
          '

  deploy-obsidian:
    name: Deploy Obsidian Plugin
    if: github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
    steps:
      - name: Deploy Obsidian Plugin
        run: |
          echo "Obsidian plugins are published by uploading manifest.json, main.js, and styles.css as assets to the GitHub Release."
          echo "These assets were already uploaded during the pre-release/release phase."
          echo "Obsidian pulls updates directly from the GitHub Release."

  deploy-safari:
    name: Package and Attach Safari DMG
    if: github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: macos-15
    environment: Production
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Check Existing Release Assets
        id: check-asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=$(gh release view ${{ github.event.release.tag_name }} --json assets -q '.assets[].name')
          if echo "$ASSETS" | grep -q "Markdown-Comments-macOS.dmg"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Markdown-Comments-macOS.dmg is already attached to release ${{ github.event.release.tag_name }}."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Markdown-Comments-macOS.dmg is missing from release. Packaging now."
          fi

      - name: Setup Node.js
        if: steps.check-asset.outputs.exists != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup pnpm
        if: steps.check-asset.outputs.exists != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install Dependencies
        if: steps.check-asset.outputs.exists != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build Safari Extension & Native macOS App
        if: steps.check-asset.outputs.exists != 'true'
        run: ./scripts/build-safari-app.sh

      - name: Package Release DMG
        if: steps.check-asset.outputs.exists != 'true'
        run: ./scripts/package-dmg.sh

      - name: Attach Safari DMG to Release
        if: steps.check-asset.outputs.exists != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} artifacts/Markdown-Comments-macOS.dmg --clobber

  update-website:
    name: Update Website Release Links & Deploy Pages
    needs: [deploy-safari]
    if: github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update Release Download Link in Website
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Updating website download links to production release $RELEASE_TAG..."
          
          # Update Safari DMG download link in website/index.html
          sed -i -E "s|href=\"https://github\.com/md-comments/md-comments/releases/(latest\|download/[^/]+)/download/Markdown-Comments-macOS\.dmg\"|href=\"https://github.com/md-comments/md-comments/releases/download/$RELEASE_TAG/Markdown-Comments-macOS.dmg\"|g" website/index.html
          sed -i -E "s|href=\"https://github\.com/md-comments/md-comments/releases/download/[^/]+/Markdown-Comments-macOS\.dmg\"|href=\"https://github.com/md-comments/md-comments/releases/download/$RELEASE_TAG/Markdown-Comments-macOS.dmg\"|g" website/index.html

          # Update docs if present
          if [ -f "docs/safari-extension-guide.md" ]; then
            sed -i -E "s|https://github\.com/md-comments/md-comments/releases/download/[^/]+/Markdown-Comments-macOS\.dmg|https://github.com/md-comments/md-comments/releases/download/$RELEASE_TAG/Markdown-Comments-macOS.dmg|g" docs/safari-extension-guide.md
          fi

          # Ensure release is marked latest and non-prerelease
          gh release edit "$RELEASE_TAG" --prerelease=false --latest || true

          if git diff --quiet; then
            echo "Website is already up to date with release $RELEASE_TAG."
          else
            git add website/index.html docs/safari-extension-guide.md || true
            git commit -m "chore(website): update Safari download link to $RELEASE_TAG"
            git push origin main
          fi

      - name: Trigger GitHub Pages Deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-pages.yml --ref main || echo "Pages deployment workflow triggered via push or dispatch"

