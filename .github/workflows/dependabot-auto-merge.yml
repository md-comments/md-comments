name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.actor.login == 'dependabot[bot]')
    steps:
      - name: Fetch PR Details
        id: pr_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"
            PR_URL="${{ github.event.workflow_run.pull_requests[0].html_url }}"
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
            PR_URL="${{ github.event.pull_request.html_url }}"
          fi
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Fetch Dependabot Metadata
        id: metadata
        if: steps.pr_info.outputs.pr_number != ''
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          target-pr-number: ${{ steps.pr_info.outputs.pr_number }}

      - name: Enable Auto-Merge
        if: steps.pr_info.outputs.pr_number != '' && steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          PR_URL="${{ steps.pr_info.outputs.pr_url }}"
          gh pr review --approve "$PR_URL" || true
          gh pr merge --auto --squash "$PR_URL" || true
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            gh pr merge --squash "$PR_URL" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
