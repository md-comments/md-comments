name: Live GitHub Nightly Regression Suite

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  live-extension-regression:
    name: Live GitHub Extension Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout md-comments-test
        uses: actions/checkout@v4

      - name: Checkout md-comments codebase
        uses: actions/checkout@v4
        with:
          repository: md-comments/md-comments
          path: md-comments-src

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'md-comments-src/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: md-comments-src
        run: pnpm install --frozen-lockfile

      - name: Build Chrome Extension
        working-directory: md-comments-src
        run: pnpm build:shared && pnpm build:chrome

      - name: Install Playwright Chromium
        working-directory: md-comments-src
        run: npx playwright install --with-deps chromium

      - name: Run Live GitHub Playwright E2E Tests
        working-directory: md-comments-src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_REPO_OWNER: ${{ github.repository_owner }}
          TEST_REPO_NAME: ${{ github.event.repository.name }}
          TEST_GITHUB_USER: 'md-comments-test-bot'
        run: pnpm test:e2e:ext:live

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: md-comments-src/playwright-report/

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: md-comments-src/allure-results/
